event_suppression:
  header: X-DECISIV-SILENCE-EVENTS
  description: >-
    A caller may mute named webhook events for a single write transaction, so its own bulk writes do not
    echo back as notifications. Documented on 15 operations.

legacy_platform_api_notifications:
  docs: https://api-docs.decisiv.net/docs/api/1/architecture/notifications/
  style: thin notification — the payload is a URL pointing at the changed resource, not the resource itself
  auth: HTTP Basic (URI-encoded token and OAuth listed as future schemes)
  timeout_default_seconds: 5
  retry_limit: 5
  on_exhaustion: email to the profile user's address containing the failed message
  ordering: >-
    Decisiv documents explicitly that notifications may arrive out of order — both from concurrent
    consumer processes and from retried timeouts — and describes the resulting read-consensus problem
    and locking mitigations. This is unusually candid delivery-semantics documentation.

