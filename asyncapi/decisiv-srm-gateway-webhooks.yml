spec_type: none
note: >-
  Decisiv publishes NO AsyncAPI document. It does publish a real, managed webhook surface: the SRM
  Gateway Account Management module exposes CRUD over webhook endpoints plus a signing-key rotation
  operation and a catalog endpoint listing the events an account may subscribe to. The event names below
  are taken verbatim from the response examples in the published OpenAPI — they are Decisiv's own
  canonical names, not invented. The full authoritative list for a given account is only readable from
  GET /account_management/v1/accounts/{account_id}/webhook_events, which is auth-gated; the 19 names
  here are the ones Decisiv puts in its own documentation examples.

surface: webhooks
transport: https
delivery: outbound HTTP POST to a subscriber-registered https URL
security:
  signing_key: true
  signing_key_rotation_operation: refreshSigningKeyWebhooksbyId
  https_required: true
  note: >-
    Endpoint URLs are pattern-constrained to ^https:// in the schema. Each webhook carries a signing key
    that the subscriber can rotate via POST .../webhooks/{id}/refresh_signing_key. Decisiv does not
    publish the signature algorithm or header name in the public spec.

