  deprecated_features:
  - item: OAuth 2.0 password grant (OAuth2Password security scheme)
    status: deprecated
    evidence: >-
      "**Deprecated.** OAuth 2.0 Password flow. New integrations must use the Authorization Code flow
      (`OAuth2AuthorizationCode`); this flow remains available only during the migration window and will
      be removed in a future release." — declared in the securitySchemes of all four SRM Gateway specs.
    replacement: OAuth2AuthorizationCode (authorization code + PKCE)
    removal_date: null
  - item: X-Decisiv-Transition-Token
    status: transitional
    evidence: >-
      Required alongside OAuth on the Global Assets / Service Provider / Platform APIs "during this
      transition" to OAuth 2.0 — https://api-docs.decisiv.net/docs/api/oauth/
  note: >-
    Decisiv marks individual features deprecated inside the specs but publishes NO deprecation policy
    page, no removal timeline, and no Sunset/Deprecation response headers. A consumer on the password
    grant has been told it will be removed "in a future release" and nothing more.

