- name: Decisiv Platform API
  description: >-
    The original XML Platform API for service providers and dealer systems, covering the lifecycle of a service
    case — assets, cases, estimates and line items, parts, VMRS, notes, attachments and estimate approval, plus
    service locations, users and push notifications. Versioned by Accept-Version and Accept headers; XSD schemas
    for every version are published as a downloadable bundle.
  humanURL: https://api-docs.decisiv.net/docs/api/1
  baseURL: https://api.decisiv.net/platform_api
  tags:
  - Cases
  - Estimates
  - Service Locations
