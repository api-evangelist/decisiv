- name: Decisiv Global Assets API
  description: >-
    Global store of reference for all assets within the Decisiv ecosystem — asset lookup by id or VIN, plus
    campaigns, recalls, warranties, service history and OEM build information where authorized and available.
    Swagger 2.0, secured with OAuth 2.0 plus the X-Decisiv-Transition-Token header.
  humanURL: https://global-assets.decisivapps.com/api-docs/
  baseURL: https://global-assets.decisivapps.com/api/v1/
  tags:
  - Assets
  - VIN
