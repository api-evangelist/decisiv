aid: decisiv
name: Decisiv
description: >-
  Decisiv is the Reston, Virginia company behind the commercial vehicle industry's Service Relationship Management
  (SRM) platform — a cloud service that connects fleets, asset owners, OEMs, dealers, independent service providers
  and component suppliers around a single service event. The platform orchestrates the whole repair lifecycle:
  asset registration and VIN-based identification, service requests, case creation, estimates and line items with
  VMRS coding, parts, labor and additional charges, technician time tasks, notes, attachments, approvals, sublet
  work between shops, and telematics-driven fault codes and diagnostic readings. Decisiv exposes this through the
  SRM Gateway APIs — four JSON:API-shaped OpenAPI 3.1 modules (Account Management, Asset Management, Service
  Management, Telematics) — plus the older Global Assets and Service Provider Swagger 2.0 APIs and the XML Platform
  API. Access is OAuth 2.0 and provisioned per account; documentation is public but credentials come through sales.
