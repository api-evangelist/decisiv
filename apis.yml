  - type: Overlay
    url: overlays/decisiv-global-assets-overlay.yaml
- name: Decisiv Service Provider API
  description: >-
    Base API allowing dealers and service providers to interact with their customers and those customers' assets,
    including group customers and group assets. Swagger 2.0, secured with OAuth 2.0 plus the transition token.
  humanURL: https://service-provider.decisivapps.com/api-docs/
  baseURL: https://service-provider.decisivapps.com/api/v1/
