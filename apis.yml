- name: Decisiv SRM Gateway - Asset Management
  description: >-
    The fleet / asset-owner view of the SRM Gateway. Registered assets and components, depots, extended asset
    attributes, contacts, service requests to service providers, cases and case summaries, case notes, attachments,
    participants and recipients, estimates, and the VMRS coding reference.
  humanURL: https://srm-api.decisivapps.com/api-docs/v1?urls.primaryName=Asset%20Management
  baseURL: https://srm-api.decisivapps.com
  tags:
