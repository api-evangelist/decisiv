  - type: Overlay
    url: overlays/decisiv-asset-management-overlay.yaml
- name: Decisiv SRM Gateway - Service Management
  description: >-
    The service-provider view of the SRM Gateway and the largest module. Cases and case actions, customers and
    customer assets, customer requests, line items with parts, additional charges, technician stories and internal
    labels, case metadata, time tasks, skill levels, departments, program types, repair statuses, service networks,
    sublet cases / requests / associations between shops, diagnostic readings, faults, and VMRS.
  humanURL: https://srm-api.decisivapps.com/api-docs/v1?urls.primaryName=Service%20Management
