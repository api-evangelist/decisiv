- name: Decisiv SRM Gateway - Account Management
  description: >-
    Accounts, ecosystem users, account users and roles, and the webhook subscription surface for the Decisiv SRM
    Gateway. This is the module that manages webhook endpoints (URL, subscribed events, custom headers, enabled
    state) and rotates the webhook signing key, plus the catalog of webhook events an account may subscribe to.
  humanURL: https://srm-api.decisivapps.com/api-docs/v1?urls.primaryName=Account%20Management
