api_client_sdk_note: >-
  DECISIV SHIPS NO API CLIENT LIBRARY IN ANY LANGUAGE. Searches of npm, PyPI, RubyGems, Maven Central,
  NuGet, crates.io, Packagist and pkg.go.dev return no Decisiv SDK for the SRM Gateway, Global Assets,
  Service Provider or Platform APIs, and neither the docs site nor the GitHub org publishes one. Every
  integrator hand-rolls an HTTP client against the JSON:API surface. The packages below are real,
  first-party and published under the @decisiv npm scope, but they are the Decisiv Key DESIGN SYSTEM —
  React UI building blocks for building SRM Ecosystem application interfaces — not clients for the API.
  They are recorded here honestly as what they are.
