currency:
  newest_publish: '2020-08-10'
  finding: >-
    Every published @decisiv package last shipped in 2019-2020. The design system has not had a release
    in nearly six years while the SRM Gateway it is meant to build interfaces for has moved to build
    0.48.24 with four OpenAPI 3.1 modules. @decisiv/ui-components 2.0.0 (2020-08-10) is the newest
    artifact in the scope. This is the clearest provider-published, provider-dated decay signal on the
    Decisiv developer surface.
github_org:
  url: https://github.com/Decisiv
  public_repos: 39
  finding: >-
    The public GitHub organisation is almost entirely forks of third-party Ruby/Elixir/JavaScript
    libraries (rack, resque, devise, ancestry, bypass, calcinator, alembic, samly). The only original
    first-party code is the styled-components tooling. No API client, no .proto, no OpenAPI, no
    example integration is published there.
