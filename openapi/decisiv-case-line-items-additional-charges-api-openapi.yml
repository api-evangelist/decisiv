components:
  schemas:
    additional_charge_properties-data:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - line_item_additional_charges
        attributes:
          type: object
          properties:
            code:
              type: string
              description: The code for the additional charge
              maxLength: 20
              example: TAX-123
            description:
              type: string
              description: The description for the additional charge
              maxLength: 255
              example: Required state tax for the service
            pricing:
              type: object
              description: Pricing information for the additional charge
              properties:
                amount:
                  type: string
                  description: The amount for the additional charge, formatted as a decimal with two decimal places
                  pattern: ^-?\d{1,7}\.\d{2}$
                  example: '8.25'
                sales_tax_amount:
                  type: string
                  description: The amount for the sales tax in the additional charge, formatted as a decimal with two decimal places
                  pattern: ^-?\d{1,7}\.\d{2}$
                  example: '1.25'
                total_amount:
                  type: string
                  description: The amount and the sales tax added together for the additional charge, formatted as a decimal with two decimal places
                  pattern: ^-?\d{1,7}\.\d{2}$
                  example: '9.50'
            created_at:
              type: string
              format: date-time
              description: '`ISO 8601` timestamp indicating when the additional charge was created'
            updated_at:
              type: string
              format: date-time
              description: '`ISO 8601` timestamp indicating when the additional charge was updated'
          required:
          - code
          - description
          - pricing
        relationships:
          type: object
          properties:
            category:
              $ref: '#/components/schemas/relationship_object'
      required:
      - attributes
      - type
      - id
    error_response:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
        detail:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        source:
          type: object
          properties:
            parameter:
              type:
              - string
              - 'null'
            pointer:
              type:
              - string
              - 'null'
        links:
          type: object
          description: Links related to this error (e.g. documentation reference).
          additionalProperties:
            type: string
            format: uri
      required:
      - status
      - title
    relationship_object:
      type: object
      properties:
        data:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            type:
              type: string
          required:
          - id
          - type
      required:
      - data
    create_additional_charge:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            attributes:
              type: object
              required:
              - description
              - pricing
              properties:
                code:
                  type: string
                  description: The code for the additional charge
                  maxLength: 20
                  example: TAX-123
                description:
                  type: string
                  description: The description for the additional charge
                  maxLength: 255
                  example: Required state tax for the service
                pricing:
                  type: object
                  description: Pricing information for the additional charge
                  properties:
                    amount:
                      type: string
                      description: The amount for the additional charge, formatted as a decimal with up to two decimal places.
                      pattern: ^-?\d{1,7}(\.\d{1,2})?$
                      example: '8.25'
            relationships:
              type: object
              required:
              - category
              properties:
                category:
                  type: object
                  description: The additional charge category to associate with this charge.
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - type
                      - id
                      properties:
                        type:
                          type: string
                          enum:
                          - additional_charge_categories
                        id:
                          type: string
                          format: uuid
                          description: The UUID of the additional charge category.
                          example: 5f3a7d6c-8b1e-4f2a-9c4d-1e5b8a7f2c3d
          required:
          - type
          - attributes
          - relationships
    update_additional_charge:
      type: object
      required:
      - data
      properties:
        data:
