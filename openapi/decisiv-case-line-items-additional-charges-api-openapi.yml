                  description: Pricing information for the additional charge
                  properties:
                    amount:
                      type: string
                      description: The amount for the additional charge, formatted as a decimal with two decimal places
                      pattern: ^-?\d{1,7}\.\d{2}$
                      example: '8.25'
            relationships:
              type: object
              properties:
                category:
                  type: object
                  description: The additional charge category id
                  properties:
                    type:
                      type: string
                      example: additional_charge_categories
                    id:
                      type: string
                      example: The UUID of the additional charge category
          required:
          - type
          - attributes
          - id
          - relationships
    additional_charges:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/additional_charge_properties-data'
        meta:
          type: object
    additional_charge:
      type: object
      required:
