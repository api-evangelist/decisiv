          properties:
            type:
              type: string
            id:
              type: string
              format: uuid
            attributes:
              type: object
              required:
              - description
              - pricing
              properties:
                code:
                  type: string
                  description: The code for the additional charge
                  maxLength: 20
                  example: TAX-123
                description:
                  type: string
                  description: The description for the additional charge
                  maxLength: 255
                  example: Required state tax for the service
                pricing:
