    - source
parameters:
  historySort:
    name: sort
    in: query
    description: 'Return records ordered by specified attribute, in ascending order. For descending order the sort attribute
      is prepended by a ''-''. '
    required: false
    type: string
    enum:
    - case_id
    - -case_id
    - occurred_at
    - -occurred_at
  occurredAfterParam:
    name: filter[occurred_after]
    in: query
    description: 'Return records occurred after date, ex: 20170101 (YYYYMMDD)'
    required: false
    type: string
    format: YYYYMMDD
  occurredBeforeParam:
    name: filter[occurred_before]
    in: query
    description: 'Return records occurred before date, ex: 20170101 (YYYYMMDD)'
    required: false
    type: string
    format: YYYYMMDD
  caseIdParam:
    name: filter[case_id]
    in: query
    description: 'Return records based on the given case_id, ex: 3243'
    required: false
    type: string
    minLength: 1
    maxLength: 20
  vinParam:
    name: filter[vin]
    in: query
    description: 17 character VIN number
    required: true
    type: string
    minLength: 12
    maxLength: 17
  fullVinRequiredParam:
    name: vin
    in: path
    description: 17 character VIN number
    required: true
    type: string
    minLength: 17
    maxLength: 17
  serialParam:
    name: filter[serial_number]
    in: query
    description: 'Partial match for a serial number, ex: 2112*'
    required: false
    type: string
    minLength: 3
    maxLength: 9
  unitNumberParam:
    name: filter[unit_number]
    in: query
    description: Unit Number to filter collection by
    required: false
    minLength: 3
    maxLength: 99
    type: string
  assetId:
    name: asset_id
    in: path
    description: UUID of Asset to fetch
    required: true
    type: string
  customerId:
    name: customer_id
    in: path
    description: ID of Customer
    required: true
    type: string
  createdBeforeParam:
    name: created_before
    in: query
    description: 'Return records created before date, ex: 20170101 (YYYYMMDD)'
    required: false
    type: string
    format: YYYYMMDD
  createdAfterParam:
    name: created_after
    in: query
    description: 'Return records created after date, ex: 20170101 (YYYYMMDD)'
    required: false
    type: string
    format: YYYYMMDD
  serviceLocationIdParam:
    name: service_location_id
    in: query
    required: false
    description: ID of Service Location
    type: string
  updatedBeforeParam:
    name: updated_before
    in: query
    description: 'Return records updated before date, ex: 20170101 (YYYYMMDD)'
    required: false
    type: string
    format: YYYYMMDD
  updatedAfterParam:
    name: updated_after
    in: query
    description: 'Return records updated after date, ex: 20170101 (YYYYMMDD)'
    required: false
    type: string
    format: YYYYMMDD
securityDefinitions:
  TransitionToken:
    type: apiKey
    in: header
    name: X-Decisiv-Transition-Token
    description: The transition token must be specified when using OAuth. Please see https://api-docs.decisiv.net/docs/api/oauth/
  OAuth2Password:
    type: oauth2
    flow: password
    description: Oauth flow with Transition Token. See https://api-docs.decisiv.net/docs/api/oauth/
    tokenUrl: https://portal.decisivapps.com/oauth/token
  Bearer:
    type: apiKey
    name: Authorization
    in: header
