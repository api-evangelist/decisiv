            example: assets
          attributes:
            allOf:
            - $ref: '#/definitions/assetCustomerId'
  customerAsset:
    type: object
    properties:
      customer_id:
        type: integer
        description: Customer ID
        example: 42
      asset_id:
        type: string
        description: Asset UUID
        example: c441e9ee-d990-4759-b6ab-00230ab6647e
      vin:
        type: string
        minLength: 17
        maxLength: 17
        example: 1C4RJFATXDC591345
      serial_number:
        type: string
        example: DC591345
      unit_number:
        type: string
        description: Unit Number
        example: VT84
  jsonapiCustomerAssetResponse:
    type: object
    properties:
      data:
