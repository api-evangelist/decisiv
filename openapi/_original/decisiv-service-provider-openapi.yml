    required: false
    type: string
    minLength: 12
    maxLength: 17
  requiredVinParam:
    name: filter[vin]
    in: query
    description: 'Exact match for a VIN, ex: JN1AR5XXXXXX*'
    required: true
    type: string
    minLength: 12
    maxLength: 17
  serialParam:
    name: filter[serial_number]
    in: query
    description: 'Partial match for a serial number, ex: 2112*'
    required: false
    type: string
    minLength: 3
    maxLength: 9
  dmsIdParam:
