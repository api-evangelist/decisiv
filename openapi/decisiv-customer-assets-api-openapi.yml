  /service_management/{srm_account_id}/v1/customer_assets/{id}/service_history:
    get:
      summary: List Service History for the specific Customer Asset
      tags:
      - Customer Assets
      parameters:
      - name: srm_account_id
        in: path
        description: The account ID for SRM
        required: true
        schema:
          type: string
      - name: id
        in: path
        schema:
          type: string
          format: uuid
        description: The resource UUID
        required: true
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - service_provider
        description: The relationships to be included.
      - name: filter[service_provider.id]
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: List `service histories` matching the *exact* `service_prodiver.id` attribute.
      - name: filter[reference_number]
        in: query
        required: false
        schema:
          type: integer
        description: List `service histories` matching the *exact* `reference_number` attribute.
      - name: filter[event_timestamps.closed_at:blank]
        in: query
        required: false
        schema:
          type: boolean
        description: List `service histories` matching if `closed_at` attribute is blank.
      - name: filter[event_timestamps.started_at:lt]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Timebased filter to list service histories started _less than_ a specified `ISO 8601` timestamp.
      - name: filter[event_timestamps.started_at:lte]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Timebased filter to list service histories started _less than or equal to_ a specified `ISO 8601` timestamp.
      - name: filter[event_timestamps.started_at:gt]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Timebased filter to list service histories started _greater than_ a specified `ISO 8601` timestamp.
      - name: filter[event_timestamps.started_at:gte]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Timebased filter to list service histories started _greater than or equal to_ a specified `ISO 8601` timestamp.
      - name: filter[event_timestamps.closed_at:lt]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Timebased filter to list service histories closed _less than_ a specified `ISO 8601` timestamp.
      - name: filter[event_timestamps.closed_at:lte]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Timebased filter to list service histories closed _less than or equal to_ a specified `ISO 8601` timestamp.
      - name: filter[event_timestamps.closed_at:gt]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Timebased filter to list service histories closed _greater than_ a specified `ISO 8601` timestamp.
      - name: filter[event_timestamps.closed_at:gte]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Timebased filter to list service histories closed _greater than or equal to_ a specified `ISO 8601` timestamp.
      - name: page[number]
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Sets the desired `page` when encountering larger result sets
      - name: page[size]
        in: query
        required: false
        schema:
          type: integer
          default: 25
          minimum: 1
        description: Sets the desired maximum number of results per page
      responses:
        '200':
          description: Show the list of Service History for requested Customer Asset
          content:
            application/vnd.api+json:
              example:
                data:
                - id: 487136d2-c4d6-424c-b018-f1ed8a740c6a
                  type: in_network_cases
                  attributes:
                    cause: This is the cause
                    complaint: This is the complaint
                    correction: This is the correction
                    event_timestamps:
                      closed_at: '2025-04-10T13:30:41Z'
                      started_at: '2025-04-08T13:30:41Z'
                    reference_number: 321098
                    repair_status: parts_ordered
                  relationships:
                    service_provider:
                      data:
                        type: service_providers
                        id: 65b8d7f1-77aa-4b62-9a62-7207da98bb94
              schema:
                $ref: '#/components/schemas/service_histories'
        '400':
          description: This response may occur when an invalid request has been provided to the server.  The request may be corrected by the consumer and resubmitted.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Filter not allowed
                  detail: '''{{filter_name}}'' is not allowed. Valid filters: {{filters_list}}'
                  code: decisiv:filters:001
                  status: '400'
                  source:
                    parameter: filter[filter_name]
                - code: decisiv:filters:010
                  detail: Invalid filter value `{{invalid_filter}}`. Expected an ISO 8601 timestamp.
                  status: '400'
                  source:
                    parameter: filter[event_timestamps.started_at:gte]
              schema:
                $ref: '#/components/schemas/errors_response'
        '401':
          description: This response may occur when the access token provided within the Authorization token has expired.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Access unauthorized
                  detail: Access unauthorized
                  code: decisiv::access_token:001
                  status: '401'
              schema:
                $ref: '#/components/schemas/errors_response'
        '403':
          description: This response may occur when the authenticated user embedded within the Authorization header does not have access to the requested resource.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Forbidden
                  detail: User does not have permission to perform this action on the requested resource(s)
                  code: decisiv:access:001
                  status: '403'
              schema:
                $ref: '#/components/schemas/errors_response'
        '404':
          description: This response may occur when the requested resource is not found.
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '404'
                  code: decisiv:resource:001
                  title: Resource not found
                  detail: The parent resource could not be found
                  source:
                    parameter: id
              schema:
                $ref: '#/components/schemas/errors_response'
        '422':
          description: Unprocessable record / This response may occur when the shared vehicle history is not enable to the account
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/errors_response'
              examples:
                Unprocessable record:
                  value:
                    errors:
                    - code: '422'
                      detail: Validation Error
                      status: '422'
                      title: Validation Error
                This response may occur when the shared vehicle history is not enable to the account:
                  value:
                    errors:
                    - status: '422'
                      code: '422'
                      title: Unprocessable record
                      detail: Shared vehicle history is not enabled for this dealer.
components:
  schemas:
    create_customer_asset_registered:
      title: Customer Asset using an existing Registered Asset
      type: object
      description: 'Create a Customer Asset linked to an existing Registered Asset (i.e. an

        already-registered vehicle). On this branch the supplied

        `vmrs.asset_type.code` is written onto the underlying vehicle''s

        `asset_type` ONLY when that vehicle has no value yet (silent no-op

        otherwise — overwriting / clearing belong on

        `PATCH /asset_management/{srm_account_id}/v1/registered_assets/{uuid}`).

        '
      required:
      - data
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            attributes:
              type: object
              properties:
                unit_number:
                  type: string
                  description: Identification number commonly used on assets residing within a fleet
                make:
                  type: string
                  description: Brand of the asset
                  maxLength: 100
                year:
                  type: integer
                  description: 'Calendar year the asset model was released, minimum: 1970, maximum: next year'
                vmrs:
                  type: object
                  description: 'VMRS classification of the asset. Optional on create.


                    On the registered_asset branch the supplied `code` is written

                    through to the underlying vehicle''s `asset_type` ONLY when that

                    vehicle currently has no value. If the vehicle already has an

                    `asset_type`, the supplied value is silently ignored — clearing

                    and overwriting belong on

                    `PATCH /asset_management/{srm_account_id}/v1/registered_assets/{uuid}`,

                    not on this create endpoint.

                    '
                  properties:
                    asset_type:
                      type: object
                      description: VMRS Code Key 2 (Equipment Category).
                      properties:
                        code_key:
                          type: string
                          description: The VMRS code key identifier. Must be `"2"` when supplied.
                          example: '2'
                        code:
                          type: string
                          description: The VMRS Code Key 2 code (e.g. `"D"`, `"1"`, `"R"`). Must match an active value from `GET /vmrs/asset_types`.
                          example: R
            relationships:
              type: object
              properties:
                registered_assets:
                  type: object
                  description: The registered asset id
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          example: registered_assets
                        id:
                          type: string
                          example: The UUID of the registered_asset
    customer_asset_by_id:
      example:
        data:
          type: customer_assets
          id: aa3e7935-bfe2-475e-9be2-80ccef5477c8
          attributes:
            vin: 3B7HF13Z11M269883
            serial_number: HN991562
            unit_number: NU2695
            chassis_id: N-991562
            make: Make
            model: CH613
            year: 2017
            service_status: active
            engine:
              make: Engine Make
            vmrs:
              asset_type:
                code_key: '2'
                code: D
          relationships:
            customer:
              data:
                type: customers
                id: cd91f5cb-5c38-4f10-90cb-de2efad3ee82
            srm_verified_asset:
              data:
                type: srm_verified_assets
                id: a6cfb121-5e78-4ec4-a7ea-223900c76607
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              enum:
              - customer_assets
              - service_group_customer_assets
            attributes:
              type: object
              properties:
                vin:
                  type: string
                  description: 17 digit vehicle identification number
                  minLength: 17
                  maxLength: 17
                serial_number:
                  type: string
                  description: Production number of the asset
                  minLength: 8
                  maxLength: 9
                chassis_id:
                  type: string
                  description: Unique identifier consisting of a letter (chassis series) and six digits (chassis number)
                  maxLength: 50
                unit_number:
                  type: string
                  description: Identification number commonly used on assets residing within a fleet
                make:
                  type: string
                  description: Brand of the asset
                  maxLength: 100
                model:
                  type: string
                  description: Name of the asset product from the manufacturer
                  maxLength: 100
                year:
                  type: integer
                  description: 'Calendar year the asset model was released, minimum: 1970, maximum: two years from now'
                service_status:
                  type: string
                  description: "Current service eligibility for this customer asset.\n\n- `active` — service relationship is currently in force between\n  the Service Provider account and the customer on the asset.\n- `inactive` — no longer the current association; superseded by\n  a newer record for the same asset, but remains serviceable.\n  Creating a case against it flips the asset back to `active`.\n- `archived` — the underlying registered asset has been\n  deactivated by its Registered Asset Management account holder;\n  the asset is reference-only and cannot be used to create new\n  cases.\n"
                  enum:
                  - active
                  - inactive
                  - archived
                engine:
                  type: object
                  properties:
                    make:
                      type:
                      - string
                      - 'null'
                vmrs:
                  type: object
                  description: VMRS classification of the asset
                  properties:
                    asset_type:
                      type: object
                      description: VMRS Code Key 2 (Equipment Category)
                      properties:
                        code_key:
                          type: string
                          description: The VMRS code key identifier
                          example: '2'
                        code:
                          type: string
                          description: The VMRS code value for the equipment category (e.g. 'D', '1', 'R')
              required:
              - service_status
            relationships:
              type: object
              properties:
                customer:
                  type: object
                  required:
                  - data
                  properties:
                    data:
                      type:
                      - object
                      - 'null'
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                          - customers
                          - registered_customers
                          - service_group_customers
                          - service_group_registered_customers
                srm_verified_asset:
                  description: When present, indicates this asset's identity has been verified against a manufacturer-sourced canonical record. The associated YMMI (Year, Make, Model, and Identifier) values are OEM-authoritative and supersede any locally stored asset attributes.
                  $ref: '#/components/schemas/relationship_object'
              required:
              - customer
            links:
              type: object
              properties:
                self:
                  type: string
                source_application:
                  type: string
          required:
          - attributes
          - relationships
          - type
          - id
      required:
      - data
