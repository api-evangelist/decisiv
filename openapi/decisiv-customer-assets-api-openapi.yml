          type: object
          properties:
            type:
              type: string
              enum:
              - cases
            attributes:
              type: object
              properties:
                auth_number:
                  type: string
                  description: The Authorization number
                  maxLength: 40
                po_number:
                  type: string
                  description: The Purchase Order number
                  maxLength: 40
                ro_number:
                  type: string
                  description: The Repair Order number
                  maxLength: 40
                complaint:
                  type: string
                  description: Initially reported information from driver or other customer entity
                  maxLength: 6000
                cause:
                  type: string
                  description: Documentation of the technical failure assessed by the Service Location
                  maxLength: 6000
                correction:
                  type: string
                  description: Summary of the actual work accomplished to address the reported issue
                  maxLength: 6000
                repair_status:
                  type: string
                  description: ID of the repair status from `GET /service_management/{srm_account_id}/v1/repair_statuses.`
                  example: asset_ready
                metadata:
                  type: array
                  description: Metadata about the case
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        description: Metadata key has to start and end with a letter or number, be lower snake case
                        minLength: 1
                        maxLength: 50
                        pattern: ^[a-z0-9]+(_{1}[a-z0-9]+)*$
                        example: some_key
                      value:
                        type: string
                        description: The metadata value must be a string with 500 characters or less
                        minLength: 1
                        maxLength: 500
                        example: The value goes here
                invoice:
                  type: object
                  description: Invoice details
                  properties:
                    total:
                      type: number
                      description: Total amount for the invoice
                      example: 432.5
                      maximum: 999999.99
                    number:
                      type: string
                      description: Number of the invoice
                      example: TR3847
                      maxLength: 255
                    date:
                      type: string
                      format: date
                      description: Date of the invoice in `ISO 8601` format
                      example: '2025-06-19'
                tag_number:
                  type: string
                  description: 'Tag #, sometimes called Repair Tag, or Key Tag, is a tag that is attached to the truck keys when a truck is dropped off, so shop personnel can easily find the keys on a tag board and know which case/RO that set of keys/truck belonged to.'
                  maxLength: 40
                event_timestamps:
                  type: object
                  description: Timestamp attributes relfecting key events surround the case
                  properties:
                    followup_time:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating the next check-in point between Customer / Provider'
                      example: '2025-10-10T13:30:41Z'
                    asset_uptime:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the Asset became operational, once again'
                      example: '2025-04-10T13:00:41Z'
                    asset_downtime:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the Asset was considered no longer operational'
                      example: '2025-04-10T10:30:41Z'
                    asset_arrived:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the Asset arrived'
                      example: '2025-04-10T11:30:41Z'
                    asset_checked_in:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the check-in was performed'
                      example: '2025-04-10T12:30:41Z'
                    estimated_time_to_repair:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating the time estimated to repair the asset'
                      example: '2025-04-10T13:15:41Z'
                    actual_time_to_repair:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating the time spent to repair the asset'
                      example: '2025-04-10T13:10:41Z'
                breakdown:
                  type: object
                  description: Information about the location of the Service Provider
                  properties:
                    location:
                      type: string
                      description: Location field accepts City and/or State (eg. Newark or Newark, NJ to be unambiguous) or GPS coordinates (eg. 37.50, -77.33).
                      maxLength: 255
                    city:
                      type: string
                      description: Breakdown City name
                      maxLength: 255
                    state:
                      type: string
                      description: Second part of the `ISO 3166-2` code indicating the breakdown State
                      minLength: 1
                      maxLength: 3
                      example: NJ
                    country:
                      type: string
                      description: '`ISO 3166-1` alpha-2 code indicating the breakdown Country'
                      minLength: 2
                      maxLength: 2
                      example: US
                vmrs:
                  type: object
                  description: Case-level VMRS codes. Each code is provided as a `{ code_key, code }` object, consistent with `vmrs.asset_type`.
                  properties:
                    reason_for_repair:
                      type: object
                      description: VMRS Code Key 14 — identifies what caused the asset to come in for repair
                      properties:
                        code_key:
                          type: string
                          description: The VMRS code key identifier
                          example: '14'
                        code:
                          type: string
                          description: A valid VMRS Code Key 14 value
                          example: '01'
                    repair_priority:
                      type: object
                      description: VMRS Code Key 16 — priority assigned to the repair
                      properties:
                        code_key:
                          type: string
                          description: The VMRS code key identifier
                          example: '16'
                        code:
                          type: string
                          description: A valid VMRS Code Key 16 value
                          example: '1'
                    repair_site:
                      type: object
                      description: VMRS Code Key 17 — relative location where the repair takes place
                      properties:
                        code_key:
                          type: string
                          description: The VMRS code key identifier
                          example: '17'
                        code:
                          type: string
                          description: A valid VMRS Code Key 17 value
                          example: '1'
            relationships:
              type: object
              properties:
                assignee:
                  $ref: '#/components/schemas/relationship_object'
                driver:
                  $ref: '#/components/schemas/relationship_object'
                primary_contact:
                  $ref: '#/components/schemas/relationship_object'
                billing_contact:
                  $ref: '#/components/schemas/relationship_object'
                program_type:
                  $ref: '#/components/schemas/relationship_object'
                department:
                  allOf:
                  - $ref: '#/components/schemas/relationship_object'
                  - description: 'Optional. Note: `department.data.id` is a dealer-scoped string code (e.g. "SERVICE"), not a UUID. The code must belong to the account and the `Departments` feature must be enabled for the account; otherwise the request fails with a 422 `Identifier not found` error.'
                shipping_customer:
                  $ref: '#/components/schemas/relationship_object'
                billing_customer:
                  $ref: '#/components/schemas/relationship_object'
          required:
          - type
          - attributes
      required:
      - data
