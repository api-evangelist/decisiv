            attributes:
              type: object
              properties:
                complaint:
                  type: string
                  description: Initially reported information from driver or other customer entity
                  maxLength: 6000
                status:
                  type: string
                  enum:
                  - pending
                  - canceled
                  - declined
                  - accepted
                  description: Status of the sublet request
                  maxLength: 255
                po_number:
                  type: string
                  description: Purchase Order number
                  maxLength: 40
                auth_number:
                  type: string
                  description: Authorization number
                  maxLength: 40
                note:
                  type: string
                  description: The notes for the sublet request
                reference_number:
                  type: integer
                  description: Integer representation of the sublet request ID inside of the User Interface
                breakdown:
                  type: object
                  description: Information about the breakdown location
                  properties:
                    city:
                      type: string
                      description: City of breakdown
                      maxLength: 255
                      examples:
                      - North Haven
                    location:
                      type: string
                      description: Exact map location of the breakdown
                      maxLength: 255
                      examples:
                      - 41.395022,-72.856326
                    state:
                      type: string
                      description: Second part of the `ISO 3166-2` code indicating the breakdown State
                      minLength: 1
                      maxLength: 3
                      examples:
                      - NJ
                event_timestamps:
                  type: object
                  description: All the timestamps related to the sublet request
                  properties:
                    requested_at:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the sublet was requested'
                    requested_appointment_time:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating the appointment time'
                    requested_completion_time:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating the completion time of the case'
                    asset_downtime:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the Asset was considered no longer operational'
                created_at:
                  type: string
                  format: date-time
                  description: '`ISO 8601` timestamp indicating when the sublet request was created'
                updated_at:
                  type: string
                  format: date-time
                  description: '`ISO 8601` timestamp indicating when the sublet request was last updated'
                primary_contact:
                  type: object
                  description: The primary contact on the sublet request.
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    email:
                      type: string
                    relation:
                      type: string
