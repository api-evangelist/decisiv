components:
  schemas:
    error_response:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
        detail:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        source:
          type: object
          properties:
            parameter:
              type:
              - string
              - 'null'
            pointer:
              type:
              - string
              - 'null'
        links:
          type: object
          description: Links related to this error (e.g. documentation reference).
          additionalProperties:
            type: string
            format: uri
      required:
      - status
      - title
    case:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              enum:
              - cases
            attributes:
              type: object
              properties:
                complaint:
                  type: string
                  description: Initially reported information from driver or other customer entity
                  examples:
                  - Broken truck
                po_number:
                  type: string
                  description: The Purchase Order number
                  examples:
                  - '1234'
                auth_number:
                  type: string
                  description: The Authorization number
                  examples:
                  - '1234'
                ro_number:
                  type: string
                  description: The Repair Order number
                  examples:
                  - '1234'
                reference_number:
                  type: number
                  description: Integer representation of the Case ID inside of the User Interface
                closed:
                  type: boolean
                  description: Indicates whether the case has been closed.
                repair_status:
                  type: string
                  description: Status of the repair
                  examples:
                  - Hold (auth)
                status:
                  type: string
                  description: Status of the case
                  examples:
                  - Pick-up
                invoice:
                  type: object
                  description: The invoice information for the case
                  properties:
                    total:
                      type: number
                      description: The total amount of the invoice
                    number:
                      type: string
                      description: The invoice number
                    invoice_date:
                      type: string
                      format: date
                      description: The date of the invoice
                      examples:
                      - '2025-04-07'
                event_timestamps:
                  type: object
                  description: All the timestamps related to the case
                  properties:
                    started_at:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the Case was first opened'
                      examples:
                      - '2022-04-14T05:23:45Z'
                    requested_completion_time:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating the completion time of the case'
                      examples:
                      - '2022-04-14T05:23:45Z'
                    requested_appointment_time:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating the appointment time'
                      examples:
                      - '2022-04-14T05:23:45Z'
                    actual_time_to_repair:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating the time spent to repair the asset'
                      examples:
                      - '2022-04-14T05:23:45Z'
                    estimated_time_to_repair:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating the time estimated to repair the asset'
                      examples:
                      - '2022-04-14T05:23:45Z'
                    followup_time:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating the next check-in point between Customer / Provider'
                      examples:
                      - '2022-04-14T05:23:45Z'
                    asset_arrived:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the Asset arrived'
                      examples:
                      - '2022-04-14T05:23:45Z'
                    asset_checked_in:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the check-in was performed'
                      examples:
                      - '2022-04-14T05:23:45Z'
                    closed_at:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the Case was marked as completed and closed'
                      examples:
                      - '2022-04-14T05:23:45Z'
                    asset_uptime:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the Asset became operational, once again'
                      examples:
                      - '2022-04-14T05:23:45Z'
                    asset_downtime:
                      type: string
                      format: date-time
                      description: '`ISO 8601` timestamp indicating when the Asset was considered no longer operational'
                      examples:
                      - '2022-04-14T05:23:45Z'
                pricing:
                  type: object
                  description: Financial totals for the case, sourced directly from the Estimate
                  properties:
                    parts_total:
                      type: number
                      description: Total cost of parts
                      examples:
                      - 432.5
                    labor_total:
                      type: number
                      description: Total cost of labor
                      examples:
                      - 250
                    core_total:
                      type: number
                      description: Total cost of cores
                      examples:
                      - 75
                    tax:
                      type: number
                      description: Total tax amount
                      examples:
                      - 32.18
                    haz_waste:
                      type: number
                      description: Total hazardous waste charge
                      examples:
                      - 15
                asset_information:
                  type: object
                  description: The asset information when the case was created
                  properties:
                    odometer_value:
                      type: number
                      description: Integer representation about the asset odometer
                    odometer_unit:
                      type: string
                      description: Abbreviation for the asset odometer unit (e.g., `mi` for miles or `km` for kilometers).
                      examples:
                      - mi
                    unit_number:
                      type: string
                      description: The unit number
                    cargo:
                      type: object
                      properties:
                        unit:
                          type:
                          - string
                          - 'null'
                          description: The unit number
                        loaded:
                          type: boolean
                          description: Indicates whether the cargo is loaded.
                        load:
                          type:
                          - string
                          - 'null'
                          description: The load amount
                breakdown:
                  type: object
                  description: Information about the breakdown location
                  properties:
                    city:
                      type: string
                      description: City of breakdown
                      examples:
                      - North Haven
                    location:
                      type: string
                      description: Exact map location of the breakdown
                      examples:
                      - 41.395022,-72.856326
                    state:
                      type: string
                      description: State of the breakdown
                      examples:
                      - CT
                updated_at:
                  type: string
                  format: date-time
                  description: '`ISO 8601` timestamp indicating when the case was last updated'
                  examples:
                  - '2022-04-14T05:23:45Z'
                created_at:
                  type: string
                  format: date-time
                  description: '`ISO 8601` timestamp indicating when the case was created'
                  examples:
                  - '2022-04-14T05:23:45Z'
            relationships:
              type: object
              properties:
                registered_asset:
                  $ref: '#/components/schemas/relationship_object'
                service_provider:
                  $ref: '#/components/schemas/relationship_object'
                assignee:
                  $ref: '#/components/schemas/relationship_object'
                billing_contact:
                  $ref: '#/components/schemas/relationship_object'
                primary_contact:
                  $ref: '#/components/schemas/relationship_object'
                estimates:
                  $ref: '#/components/schemas/relationship_objects'
          required:
          - attributes
          - type
          - id
    modify_case_contact_relationship:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: JSON:API resource linkage. `id` must be the `uuid` of one of the fleet's own registered contacts; `type` may be `contacts`, `registered_contacts`, or `recipients`, since a registered contact can be referenced by any of these resource types.
          properties:
            type:
              type: string
              enum:
              - contacts
              - registered_contacts
              - recipients
            id:
              type: string
              format: uuid
          required:
          - type
          - id
    relationship_objects:
      type: object
      properties:
        data:
          type: array
          items:
            type:
            - object
            - 'null'
            properties:
              id:
                type: string
              type:
                type: string
            required:
            - id
            - type
      required:
      - data
    relationship_object:
      type: object
      properties:
        data:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            type:
