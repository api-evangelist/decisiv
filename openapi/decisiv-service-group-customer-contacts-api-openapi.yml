components:
  schemas:
    contact_by_id:
      example:
        data:
          id: aa3e7935-bfe2-475e-9be2-80ccef5477c8
          type: contacts
          attributes:
            first_name: John
            last_name: Doe
            communication:
            - method_type: email
              value: john.doe@example.com
              notify: true
            - method_type: mobile
              value: '+1234567890'
              notify: true
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              enum:
              - contacts
              - service_group_contacts
              - registered_contacts
            attributes:
              type: object
              properties:
                first_name:
                  type: string
                  description: First name of the contact
                  maxLength: 100
                last_name:
                  type: string
                  description: Last name of the contact
                  maxLength: 100
                communication:
                  type: array
                  description: Array of communication methods for the contact
                  items:
                    type: object
                    properties:
                      method_type:
                        type: string
                        description: Type of communication method (e.g., email, mobile)
                        enum:
                        - email
                        - mobile
                      value:
                        type:
                        - string
                        - 'null'
                        description: Value of the communication method (e.g., email address, phone number)
                        maxLength: 128
                      notify:
                        type: boolean
                        description: Indicates if notifications should be sent to this contact
                    required:
                    - method_type
                    - value
                    - notify
              required:
              - first_name
              - last_name
              - communication
            links:
              type: object
              properties:
                self:
                  type: string
          required:
          - attributes
          - type
