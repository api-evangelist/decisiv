  /service_management/{srm_account_id}/v1/customers/{customer_id}/contacts:
    get:
      summary: List all Contacts for the requested Customer
      tags:
      - Contacts
      parameters:
      - name: srm_account_id
        in: path
        description: The account ID for SRM
        required: true
        schema:
          type: string
      - name: customer_id
        in: path
        schema:
          type: string
          format: uuid
        description: The customer UUID
        required: true
      - name: filter[name]
        in: query
        required: false
        schema:
          type: string
        description: List `contacts` matching the *exact* `name` attribute.
      - name: filter[name:like]
        in: query
        required: false
        schema:
          type: string
          minLength: 3
        description: List `contacts` matching the *partial* `name` attribute.
      - name: filter[email]
        in: query
        required: false
        schema:
          type: string
        description: List `contacts` matching the *exact* `email` attribute.
      - name: page[number]
        in: query
        required: false
        schema:
          type: integer
        description: Page number
      - name: page[size]
        in: query
        required: false
        schema:
          type: integer
        description: Page size
      - name: sort
        in: query
        required: false
        schema:
          type: string
