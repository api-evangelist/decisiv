components:
  schemas:
    contact_by_id:
      example:
        data:
          id: 014ee85e-a183-4bf7-b4d7-67e758fa2b2a
          type: contacts
          attributes:
            first_name: John
            last_name: Doe
            address1: 9009 Sunset Blvd
            address2: Door 5
            city: West Hollywood
            state: CA
            postal_code: '90069'
            country: US
            communication:
            - method_type: email
              value: john.doe@example.com
              notify: true
            - method_type: mobile
              value: '+1234567890'
              notify: true
            notes: Sample notes about the contact
          relationships:
            depot:
              data:
                id: 73814a82-d26c-4241-8421-a1a622ac9f71
                type: depots
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              enum:
              - contacts
            attributes:
              type: object
              properties:
                first_name:
                  type: string
                  description: First name of the contact
                  maxLength: 100
                last_name:
                  type: string
                  description: Last name of the contact
                  maxLength: 100
                notes:
                  type: string
                  description: Notes about the contact
                  maxLength: 200
                address1:
                  type: string
                  description: Primary address information
                  maxLength: 100
                address2:
                  type: string
                  description: Secondary address information
                  maxLength: 100
                city:
                  type: string
                  description: City in which the business resides
                  maxLength: 100
                state:
                  type: string
                  description: Second part of the `ISO 3166-2` code indicating the state
                  minLength: 1
                  maxLength: 3
                  example: NJ
                country:
                  type: string
                  description: '`ISO 3166-1` alpha-2 code indicating the country'
                  minLength: 2
                  maxLength: 2
                  example: US
                postal_code:
                  type: string
                  description: Postal ZIP Code
                  maxLength: 20
                communication:
                  type: array
                  description: Array of communication methods for the contact
                  items:
                    type: object
                    properties:
                      method_type:
                        type: string
                        description: Type of communication method (e.g., email, mobile)
                        enum:
                        - email
                        - mobile
                      value:
                        type: string
                        description: Value of the communication method (e.g., email address, phone number)
                        minLength: 2
                        maxLength: 254
                      notify:
                        type: boolean
                        description: Indicates if notifications should be sent to this contact
                    required:
                    - method_type
                    - value
