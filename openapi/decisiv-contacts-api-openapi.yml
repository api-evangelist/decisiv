        description: The resource UUID
        required: true
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - depot
        description: The relationships to be included.
      responses:
        '200':
          description: Returns a contact
          content:
            application/vnd.api+json:
              example:
