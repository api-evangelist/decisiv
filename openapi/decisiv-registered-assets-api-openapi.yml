        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
            attributes:
              type: object
              properties:
                meter_data:
                  type: array
                  description: Odometer readings to record on the registered asset.
                  items:
                    type: object
                    description: Type of meter data
                    properties:
                      meter:
                        type: string
                        enum:
                        - odometer
                        description: Meter data type to be changed
                      unit:
                        type: string
                        enum:
                        - mi
                        - km
                        description: Unit of measurement for given meter data. Valid units for `odometer` are `mi` and `km`.
                      value:
                        type: number
                        description: Reading value for the given meter data
    registered_asset_properties-data:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - registered_assets
        attributes:
          type: object
          properties:
            vin:
              type: string
              description: 17 digit vehicle identification number
              minLength: 17
              maxLength: 17
            serial_number:
              type: string
              description: Production number of the asset
              minLength: 6
              maxLength: 36
            unit_number:
              type: string
              maxLength: 255
              description: Identification number commonly used on assets residing within a fleet
            chassis_id:
              type: string
              maxLength: 255
              description: Unique identifier consisting of a letter (chassis series) and six digits (chassis number)
            fleet_info:
              type: string
              maxLength: 255
              description: Free-form text associated with the asset. Shown as "Fleet Info" in the fleet UI. No defined format or meaning.
            make:
              type: string
              maxLength: 255
              description: Brand of the asset
            model:
              type: string
              maxLength: 255
              description: Name of the asset product from the manufacturer
            year:
              type: integer
              minimum: 1970
              maximum: 2028
              description: 'Calendar year the asset model was released, minimum: 1970, maximum: two years from now'
            odometer_value:
              type: number
              description: Integer representation about the asset odometer
            odometer_unit:
              type: string
              description: ' The unit of measure for odometer value represented in standard or metric (mi = Miles or km = Kilometers)'
              enum:
              - mi
              - km
            engine_hours:
              type:
              - integer
              - 'null'
              description: Integer representation about the engine hours of asset
            stand_by_hours:
              type:
              - integer
              - 'null'
              description: Integer representation about the stand by hours of asset
            switch_on_hours:
              type:
              - integer
              - 'null'
              description: Integer representation about the switch on hours of asset
            fuel_consumed_value:
              type:
              - integer
              - 'null'
              description: Integer representation of the total fuel consumed by the asset (stored in gallons)
            fuel_consumed_unit:
              type: string
              description: Unit of measure for fuel consumed. Always returned as `gal`.
              enum:
              - gal
            notes:
              type: string
              maxLength: 1000
              description: Notes about the asset
            gvwr:
              type: object
              description: Gross Vehicle Weight Rating
              properties:
                value:
                  type: string
                  description: The numeral value for the weight
                unit_of_measure:
                  type: string
                  description: The unit of measure used, can be `kg` or `lb`
                  enum:
                  - kg
                  - lb
            engine:
              type: object
              description: Engine data
              properties:
                make:
                  type: string
                  maxLength: 255
                  description: The make of the engine
                model:
                  type: string
                  maxLength: 255
                  description: The model of the engine
                displacement:
                  type: string
                  maxLength: 50
                  description: The engine size related in liters or cubic inches
                serial_number:
                  type: string
                  description: The engine serial number
                  minLength: 1
                  maxLength: 40
