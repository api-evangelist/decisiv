  /service_management/{srm_account_id}/v1/registered_assets:
    get:
      summary: List all registered assets filtered by vin or serial number or unit number
      tags:
      - Registered Assets
      parameters:
      - name: srm_account_id
        in: path
        description: The account ID for SRM
        required: true
        schema:
          type: string
      - name: filter[serial_number]
        in: query
        required: false
        schema:
          type: string
          minLength: 8
          maxLength: 9
        description: Filter `registered_assets` matching the *exact* `serial_number` attribute.
      - name: filter[unit_number]
        in: query
        required: false
        schema:
          type: string
        description: Filter `registered_assets` matching the *exact* `unit_number` attribute.
      - name: filter[vin]
        in: query
        required: false
        schema:
          type: string
          minLength: 17
          maxLength: 17
        description: Filter `registered_assets` matching the *exact* `vin` attribute.
      - name: filter[chassis_id]
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
        description: Filter `registered_assets` matching the *exact* `chassis_id` attribute.
      - name: page[number]
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Sets the desired `page` when encountering larger result sets
      - name: page[size]
        in: query
        required: false
        schema:
          type: integer
          default: 25
          minimum: 1
        description: Sets the desired maximum number of results per page
      responses:
        '200':
          description: Returns list of registered assets
          content:
            application/vnd.api+json:
              example:
                data:
                - id: f444a054-4889-484a-b549-7a60caa5d79f
                  type: registered_assets
                  attributes:
                    vin: 3B7HF13Z11M269883
                    serial_number: 1M269883
                    unit_number: NU2695
                    chassis_id: N-991562
                    make: Acme
                    model: CH613
                    year: 2024
                    engine:
                      make: Cummins
                      model: X15
                      displacement: 14.8L
                      serial_number: '79412345'
                    odometer_value: 125000
                    odometer_unit: mi
                    vmrs:
                      asset_type:
                        code_key: '2'
                        code: D
              schema:
                $ref: '#/components/schemas/registered_assets'
        '400':
          description: This response may occur when an invalid request has been provided to the server.  The request may be corrected by the consumer and resubmitted.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Filter not allowed
                  detail: '''{{filter_name}}'' is not allowed. Valid filters: {{filters_list}}'
                  code: decisiv:filters:001
                  status: '400'
                  source:
                    parameter: filter[filter_name]
              schema:
                $ref: '#/components/schemas/errors_response'
        '401':
          description: This response may occur when the access token provided within the Authorization token has expired.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Access unauthorized
                  detail: Access unauthorized
                  code: decisiv::access_token:001
                  status: '401'
              schema:
                $ref: '#/components/schemas/errors_response'
        '403':
          description: This response may occur when the authenticated user embedded within the Authorization header does not have access to the requested resource.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Forbidden
                  detail: User does not have permission to perform this action on the requested resource(s)
                  code: decisiv:access:001
                  status: '403'
              schema:
                $ref: '#/components/schemas/errors_response'
        '404':
          description: This response may occur when the requested resource is not found.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Record not found
