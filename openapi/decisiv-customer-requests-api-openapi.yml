components:
  schemas:
    customer_request_response:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              enum:
              - customer_request_responses
            attributes:
              type: object
              properties:
                status:
                  type: string
                  description: Status of the customer request
                  enum:
                  - pending
                  - canceled
                  - declined
                  - accepted
                  example: pending
                  maxLength: 255
                note:
                  type: string
                  description: The notes for the customer request
                  example: Initial note
                event_timestamps:
                  type: object
                  description: All the timestamps related to the customer request
            relationships:
              type: object
              properties:
                customer_request:
                  $ref: '#/components/schemas/relationship_object'
          required:
          - attributes
          - type
          - id
    error_response:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
        detail:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        source:
          type: object
          properties:
            parameter:
              type:
              - string
              - 'null'
            pointer:
              type:
              - string
              - 'null'
        links:
          type: object
          description: Links related to this error (e.g. documentation reference).
          additionalProperties:
            type: string
            format: uri
      required:
      - status
      - title
    customer_request_response_decline:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            attributes:
              type: object
              properties:
                note:
                  type: string
                  description: Details on Approving the Customer's Request
                  example: There is one condition tho
    customer_request_response_accept:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            attributes:
              type: object
              properties:
                note:
                  type: string
                  description: Details on Approving the Customer's Request
                  example: There is one condition tho
                event_timestamps:
                  type: object
                  description: All the timestamps related to the customer request response
                  properties:
                    confirmed_appointment_at:
                      type: string
                      description: '`ISO 8601` timestamp indicating when appointment was scheduled'
                      example: '2025-06-18T12:41:31Z'
                      format: date-time
    customer_request_properties-data:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - customer_requests
        attributes:
          type: object
          properties:
            complaint:
              type: string
              description: Initially reported information from driver or other customer entity
              maxLength: 6000
              examples:
              - Broken truck
            po_number:
              type: string
              description: PO number
              maxLength: 40
              examples:
              - '1234'
            auth_number:
              type: string
              description: The auth number
              maxLength: 40
              examples:
              - '1234'
            note:
              type: string
              description: The notes for the customer request
              examples:
              - Initial note
            reference_number:
              type: number
              description: Integer representation of the customer request ID inside of the User Interface
            status:
              type: string
              description: Status of the customer request
              enum:
              - pending
              - canceled
              - declined
              - accepted
              maxLength: 255
              examples:
              - pending
            updated_at:
              type:
              - string
              - 'null'
              format: date-time
              description: '`ISO 8601` timestamp indicating when the customer request was updated'
              examples:
              - '2022-04-14T05:23:45Z'
            created_at:
              type:
              - string
              - 'null'
              format: date-time
              description: '`ISO 8601` timestamp indicating when the customer request was created'
              examples:
              - '2022-04-14T05:23:45Z'
            asset_information:
              type: object
              description: The asset information when the customer request was created
              properties:
                odometer_value:
                  type: number
                  description: Integer representation about the asset odometer
                odometer_unit:
                  type: string
                  description: abreviation about the unit of asset can be mi for miles or km for Kilometers
                  enum:
                  - mi
                  - km
                  examples:
                  - mi
            breakdown:
              type: object
              description: Information about the breakdown location
              properties:
                city:
                  type: string
                  description: City of breakdown
                  maxLength: 255
                  examples:
                  - North Haven
                location:
                  type: string
                  description: Exact map location of the breakdown
                  maxLength: 255
                  examples:
                  - 41.395022,-72.856326
                state:
                  type: string
                  description: Second part of the `ISO 3166-2` code indicating the breakdown State
                  minLength: 1
                  maxLength: 3
                  examples:
                  - NJ
            primary_contact:
              type: object
              description: Primary contact information
              properties:
                first_name:
                  type: string
                  description: First name
                  maxLength: 100
                  examples:
                  - Martha
                last_name:
                  type: string
                  description: Last name
                  maxLength: 100
                  examples:
                  - Wayne
                email:
                  type: string
                  description: Contact email
                  examples:
                  - martha@wayne.com
                relation:
                  type: string
                  examples:
                  - Bobby
                phone:
                  type: object
                  description: Phone information
                  properties:
                    mobile:
                      type: string
                      maxLength: 32
                      examples:
                      - (582) 123-1234
                    work:
                      type: string
                      maxLength: 32
                      examples:
                      - (582) 123-1234
            driver:
              type: object
              description: Driver information
              properties:
                first_name:
                  type: string
                  description: First name
                  maxLength: 100
                  examples:
                  - Martha
