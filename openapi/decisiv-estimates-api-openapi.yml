      summary: Retrieves an estimate for the requested account
      tags:
      - Estimates
      parameters:
      - name: srm_account_id
        in: path
        description: The account ID for SRM
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: The resource uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns an estimate
          content:
            application/vnd.api+json:
              example:
                data:
                  id: e85ac4b5-b1c9-4b0f-a35f-39fcd6c3e754
                  type: estimates
                  attributes:
                    version: 1
                    status: approved
                    total: 100
                    totals:
                      shop_supplies: 30
