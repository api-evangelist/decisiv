              schema:
                $ref: '#/components/schemas/errors_response'
  /asset_management/{srm_account_id}/v1/estimates/{id}/respond:
    post:
      operationId: respondToEstimate
      description: Responds to an estimate by approving, declining, or deferring line items.
      summary: Respond to an estimate
      tags:
      - Estimates
      parameters:
      - name: srm_account_id
        in: path
        description: The account ID for SRM
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: The resource uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the updated estimate
          content:
            application/vnd.api+json:
              example:
                data:
                  id: e85ac4b5-b1c9-4b0f-a35f-39fcd6c3e754
                  type: estimates
                  attributes:
                    version: 1
                    status: approved
                    total: 100
                    totals:
                      shop_supplies: 30
                      hazwaste: 25
                      freight: 10
                      tax: 5
                      labor: 30
                      core: 0
                      parts: 0
                    line_items:
                    - id: 0b84c64c-75ec-4a42-a899-f6f1044d0951
                      name: ''
                      parts:
                      - name: Oil Filter
                        quantity: 1
                      vmrs:
                      - code_key: '33'
                        code_key_name: Component Code
                        code: 023-001-000
                        description: Control Assembly - Mechanical, Clutch
                      total: 1272
                      totals:
                        labor: 72
                        parts: 1200
                        core: 0
                      status: approved
                    event_timestamps:
                      estimated_time_to_repair: '2025-04-07T18:58:31Z'
                      reviewed_at: '2025-04-07T18:58:31Z'
                      approval_requested_at: '2025-04-07T18:58:31Z'
                    created_at: '2025-04-07T18:58:31Z'
                    updated_at: '2025-04-07T18:58:31Z'
                  relationships:
                    service_writer:
                      data:
                        type: users
                        id: 2e7cace7-d1a5-4b89-b34c-8fb751296746
                    case:
                      data:
                        type: cases
                        id: e3dd4797-3215-4522-a2a8-7f3ccdb1fd44
                    reviewer:
                      data:
                        type: users
                        id: ed1641a8-fa41-478a-bd2e-dd72013096b0
              schema:
