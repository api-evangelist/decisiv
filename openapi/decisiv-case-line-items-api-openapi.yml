                      type:
                      - string
                      - 'null'
                      description: The user's full name.
            approval_status:
              type:
              - object
              - 'null'
              description: The metadata-backed approval status for the line item. Null when no approval has been recorded.
              properties:
                name:
                  type: string
                  description: The approval status.
                  enum:
                  - requested
                  - approved
                  - declined
                  - deferred
                  example: approved
                reason:
                  type:
                  - string
                  - 'null'
                  description: Reason associated with the approval decision.
                reason_description:
                  type:
                  - string
                  - 'null'
                  description: Free-form description of the approval reason.
                reviewed_by:
                  type:
                  - object
                  - 'null'
                  description: The user who set the approval status.
                  properties:
                    id:
                      type:
                      - string
                      - 'null'
                      description: The reviewing user's identifier.
                    name:
                      type:
                      - string
                      - 'null'
                      description: The reviewing user's full name.
                reviewed_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: When the approval status was last updated (ISO 8601).
            pricing:
              type: object
              description: Server-computed pricing breakdown — top-level totals plus per-category sub-totals for `labor`, `parts`, `core_price`, and `additional_charges`. The top-level object and `labor` expose `fixed_total` for flat-rate operations; the other sub-totals expose `estimated_total` only.
              properties:
                estimated_total:
                  type:
                  - string
                  - 'null'
                  format: decimal
                  description: Estimated total for the line item, dynamically calculated from labor time, parts, and additional charges. Null when the line item is fixed-price.
                  example: '330.00'
                fixed_total:
                  type:
                  - string
                  - 'null'
                  format: decimal
                  description: Fixed total for the line item — a flat-rate price tied to a fixed-price opcode, not dynamically calculated. Null when the line item is estimated.
                  example: '425.00'
                labor:
                  type: object
                  properties:
                    estimated_total:
                      type:
                      - string
                      - 'null'
                      format: decimal
                      description: Estimated labor price, calculated from labor time. Null when labor is fixed-price.
                      example: '140.00'
                    fixed_total:
                      type:
                      - string
                      - 'null'
                      format: decimal
                      description: Fixed labor price for fixed-price labor, not dynamically calculated. Null when labor is estimated.
                      example: '180.00'
                parts:
                  type: object
                  properties:
                    estimated_total:
                      type: string
                      format: decimal
                      description: Estimated total for parts, calculated from the parts list.
                      example: '140.00'
                additional_charges:
                  type: object
                  properties:
                    estimated_total:
                      type: string
                      format: decimal
                      description: Sum of additional charges on the line item.
                      example: '50.00'
                core_price:
                  type: object
                  properties:
                    estimated_total:
                      type: string
                      format: decimal
                      description: Estimated total for core charges on the parts list.
            vmrs:
              type: object
              description: 'Vehicle Maintenance Reporting Standards (VMRS) coding for the line item, exposing six VMRS code categories: reason for repair (CK14), operator report (CK82), component code (CK33), position (CK79), technician failure (CK18), and work accomplished (CK15). Each section is null when no code of that category is assigned.'
              properties:
                reason_for_repair:
                  type:
                  - object
                  - 'null'
                  description: Identifies what caused an asset to come in for repair
                  properties:
                    code_key:
                      type: string
                      description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                      example: '14'
                    code:
                      type: string
                      description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                      example: '01'
                operator_report:
                  type:
                  - array
                  - 'null'
                  description: Identifies what the operator reports as being the issue
                  items:
                    type: object
                    properties:
                      code_key:
                        type: string
                        description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                        example: '82'
                      code:
                        type: string
                        description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                        example: '001'
                component:
                  type:
                  - object
                  - 'null'
                  description: Provides universal identifiers or generic terms for parts
                  properties:
                    code_key:
                      type: string
                      description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                      example: '33'
                    code:
                      type: string
                      description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                      example: 023-000-000
                position:
                  type:
                  - object
                  - 'null'
                  description: Identifies position based on industry-accepted conventions
                  properties:
                    code_key:
                      type: string
                      description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                      example: '79'
                    code:
                      type: string
                      description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                      example: '03'
                technician_failure:
                  type:
                  - object
                  - 'null'
                  description: Identifies the technical failure diagnosed by the technician
                  properties:
                    code_key:
                      type: string
                      description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                      example: '18'
                    code:
                      type: string
                      description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                      example: B1
                work_accomplished:
                  type:
                  - object
                  - 'null'
                  description: Identifies the repair action the technician performed
                  properties:
                    code_key:
                      type: string
                      description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                      example: '15'
                    code:
                      type: string
                      description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                      example: A
        relationships:
          type: object
          properties:
            parts:
              description: Parts consumed or quoted on this line item, each contributing to `pricing.parts.estimated_total`. Returned as a JSON:API to-many relationship; expand via `include=parts`.
              $ref: '#/components/schemas/relationship_objects'
            technician_stories:
              description: Technician-authored notes attached to this line item, capturing the diagnostic narrative around the complaint/cause/correction. To-many; expand via `include=technician_stories`.
              $ref: '#/components/schemas/relationship_objects'
            assignee:
              description: The user assigned to perform the operation on this line item. To-one; expand via `include=assignee`.
              $ref: '#/components/schemas/relationship_object'
            case:
              description: The case (estimate) this line item belongs to. To-one; only present when expanded via `include=case` (used by the account-wide `GET /line_items` collection).
              $ref: '#/components/schemas/relationship_object'
      required:
      - attributes
      - type
      - id
    relationship_objects:
      type: object
      properties:
        data:
          type: array
          items:
            type:
            - object
            - 'null'
            properties:
              id:
                type: string
              type:
                type: string
            required:
            - id
            - type
      required:
      - data
    line_items:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/line_item_properties-data'
        meta:
          type: object
          properties:
            record-count:
              type:
              - integer
              - 'null'
              description: Total count across all pages. An integer on the case-nested collection; null on the account-wide `GET /line_items` collection, which omits the count for performance.
    create_line_item:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            attributes:
              type: object
              required:
              - name
              - opcode
              properties:
                name:
                  type: string
                  description: Name of the operation line item
                  maxLength: 510
                opcode:
                  type: string
                  description: Unique operation code
                  maxLength: 255
                complaint:
                  type: string
                  description: Complaint that originated the operation
                  maxLength: 6000
                cause:
                  type: string
                  description: Cause of the operation
                  maxLength: 6000
                correction:
                  type: string
                  description: Correction to be made in the operation
                  maxLength: 6000
                internal_label:
                  type: string
                  description: Workflow status of the line item. Values are configurable per account — see `GET /line_item_internal_labels` for the accepted values. `none` is always accepted and represents "no label".
                  maxLength: 255
                  example: approved
                description:
                  type: string
                  description: Description for the operation
                  maxLength: 6000
                price_code:
                  type: string
                  description: Price code for the operation
                  maxLength: 255
                approval_group_tag:
                  type: string
                  maxLength: 255
                  description: Free-form tag used to group line items for approval workflows.
                  example: GROUP-A
                billing_classification:
                  type: string
                  description: How the operation is billed. Maps to the operation type. Mutually exclusive with `under_warranty`.
                  enum:
                  - billable
                  - warranty
                  - policy
                  - campaign
                  - recall
                  example: warranty
                under_warranty:
                  type: boolean
                  description: Marks the operation as warranty work. Mutually exclusive with `billing_classification`.
                  example: true
                labor:
                  type: object
                  properties:
                    time:
                      type: number
                      minimum: 0
                      description: Labor hours required for the operation.
                    skill_level:
                      type: string
                      maxLength: 32
                      description: Skill level required for the operation
                    rate:
                      type: number
                      minimum: 0
                      description: Hourly labor rate for the operation.
                    total:
                      type: number
                      minimum: 0
                      description: Labor total price for the operation.
                approval_status:
                  type: object
                  description: Sets the metadata-backed approval status for the line item, attributed to the requesting user and account.
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      enum:
                      - requested
                      - approved
                      - declined
                      - deferred
                      example: approved
                    reason:
                      type: string
                      maxLength: 255
                      description: Reason associated with the approval decision.
                    reason_description:
                      type: string
                      maxLength: 6000
                      description: Free-form description of the approval reason.
                vmrs:
                  type: object
                  description: VMRS coding to persist on the new line item. Each category takes a `code` string; `operator_report` takes a list of `{ code }` entries. Categories omitted here are not set; a category sent with a blank `code` is left empty.
                  properties:
                    work_accomplished:
                      type: object
                      description: Work accomplished (VMRS CK15).
                      properties:
                        code:
                          type: string
                          maxLength: 2
                          example: A
                    technician_failure:
                      type: object
                      description: Technician-diagnosed failure (VMRS CK18).
                      properties:
                        code:
                          type: string
                          maxLength: 2
                          example: B1
                    component:
                      type: object
                      description: Component (VMRS CK33).
                      properties:
                        code:
                          type: string
                          maxLength: 11
                          example: 023-000-000
                    position:
                      type: object
                      description: Position (VMRS CK79).
                      properties:
                        code:
                          type: string
                          maxLength: 2
                          example: '03'
                    operator_report:
                      type: array
                      description: Operator reports (VMRS CK82).
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            maxLength: 3
                            example: '001'
            relationships:
              type: object
              properties:
                assignee:
                  type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - type
                      - id
                      properties:
                        type:
                          type: string
                          enum:
                          - internal_users
                          example: internal_users
                        id:
                          type: string
                          format: uuid
                          description: The uuid of the assignee
                          example: 1ed4f5ce-e426-11eb-a848-4fd53322f5bb
          required:
          - type
          - attributes
    errors_response:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/error_response'
      required:
      - errors
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2AuthorizationCode:
      type: oauth2
      description: OAuth 2.0 Authorization Code flow. This is the required flow for new integrations. See https://api-docs.decisiv.net/docs/api/oauth/
      flows:
        authorizationCode:
          authorizationUrl: https://login.decisiv.net/auth/api_gateway
          tokenUrl: https://login.decisiv.net/oauth/token
          refreshUrl: https://login.decisiv.net/oauth/token
          scopes: {}
    OAuth2Password:
      type: oauth2
      description: '**Deprecated.** OAuth 2.0 Password flow. New integrations must use the Authorization Code flow (`OAuth2AuthorizationCode`); this flow remains available only during the migration window and will be removed in a future release. See https://api-docs.decisiv.net/docs/api/oauth/'
      flows:
        password:
          tokenUrl: https://login.decisiv.net/oauth/token
          scopes: {}
