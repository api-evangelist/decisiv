                        work_accomplished:
                          code: A
                        technician_failure:
                          code: B1
                        component:
                          code: 023-000-000
                        position:
                          code: '03'
                        operator_report:
                        - code: '001'
    delete:
      summary: Delete a line item for the requested case
      operationId: deleteCaseLineItem
      description: 'Related parts and technician stories are deleted transitively.

        '
      tags:
      - Case Line Items
      parameters:
      - name: srm_account_id
        in: path
        description: The account ID for SRM
        required: true
        schema:
          type: string
      - name: case_id
        in: path
        schema:
          type: string
          format: uuid
        description: The case UUID
        required: true
      - name: id
        in: path
        schema:
          type: string
          format: uuid
        description: The resource UUID
        required: true
      responses:
        '204':
          description: No content.
          content: {}
        '401':
          description: Access token missing, invalid, or expired.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Access unauthorized
                  detail: Access unauthorized
                  code: decisiv::access_token:001
                  status: '401'
              schema:
                $ref: '#/components/schemas/errors_response'
        '403':
          description: User lacks permission on the requested resource.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Forbidden
                  detail: User does not have permission to perform this action on the requested resource(s)
                  code: decisiv:access:001
                  status: '403'
              schema:
                $ref: '#/components/schemas/errors_response'
        '404':
          description: Resource not found.
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '404'
                  code: decisiv:resource:001
                  title: Resource Identifier - Not Found
                  detail: The resource could not be found
                  source:
                    parameter: id
              schema:
                $ref: '#/components/schemas/errors_response'
        '422':
          description: The line item cannot be removed because the case is closed.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/errors_response'
              examples:
                Closed case not eligible:
                  value:
                    errors:
                    - status: '422'
                      code: decisiv:cases:line_items:001
                      title: Closed case not eligible
                      detail: Cases in the closed state cannot be modified
        '504':
          description: Gateway timeout.
          content:
            application/vnd.api+json:
              example:
                errors:
                - code: '504'
                  detail: Gateway timeout error
                  status: '504'
                  title: Gateway timeout error
              schema:
                $ref: '#/components/schemas/errors_response'
components:
  schemas:
    update_line_item:
      type: object
      description: 'PATCH body for a case line item. Note that `assignee` reassignment is not supported on PATCH — set the assignee on create and manage subsequent changes via the relationship endpoint.

        '
      required:
      - data
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
              format: uuid
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the operation line item
                  maxLength: 510
                opcode:
                  type: string
                  description: Unique operation code
                  maxLength: 255
                complaint:
                  type: string
                  description: Complaint that originated the operation
                  maxLength: 6000
                cause:
                  type: string
                  description: Cause of the operation
                  maxLength: 6000
                correction:
                  type: string
                  description: Correction to be made in the operation
                  maxLength: 6000
                internal_label:
                  type: string
                  description: Workflow status of the line item. Values are configurable per account — see `GET /line_item_internal_labels` for the accepted values. `none` is always accepted and represents "no label".
                  maxLength: 255
                  example: approved
                description:
                  type: string
                  description: Description for the operation
                  maxLength: 6000
                price_code:
                  type: string
                  description: Price code for the operation
                  maxLength: 255
                approval_group_tag:
                  type: string
                  maxLength: 255
                  description: Free-form tag used to group line items for approval workflows.
                  example: GROUP-A
                billing_classification:
                  type: string
                  description: How the operation is billed. Maps to the operation type. Mutually exclusive with `under_warranty`.
                  enum:
                  - billable
                  - warranty
                  - policy
                  - campaign
                  - recall
                  example: warranty
                under_warranty:
                  type: boolean
                  description: Marks the operation as warranty work. Mutually exclusive with `billing_classification`.
                  example: true
                labor:
                  type: object
                  properties:
                    time:
                      type: number
                      minimum: 0
                      description: Labor hours required for the operation.
                    skill_level:
                      type: string
                      maxLength: 32
                      description: Skill level required for the operation
                    rate:
                      type: number
                      minimum: 0
                      description: Hourly labor rate for the operation.
                    total:
                      type: number
                      minimum: 0
                      description: Labor total price for the operation.
                approval_status:
                  type: object
                  description: Sets the metadata-backed approval status for the line item, attributed to the requesting user and account.
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      enum:
                      - requested
                      - approved
                      - declined
                      - deferred
                      example: approved
                    reason:
                      type: string
                      maxLength: 255
                      description: Reason associated with the approval decision.
                    reason_description:
                      type: string
                      maxLength: 6000
                      description: Free-form description of the approval reason.
                vmrs:
                  type: object
                  description: VMRS coding to persist on the line item. Each category takes a `code` string; `operator_report` takes a list of `{ code }` entries. Omitted categories are left unchanged; a category sent with a blank `code` clears it.
                  properties:
                    work_accomplished:
                      type: object
                      description: Work accomplished (VMRS CK15).
                      properties:
                        code:
                          type: string
                          maxLength: 2
                          example: A
                    technician_failure:
                      type: object
                      description: Technician-diagnosed failure (VMRS CK18).
                      properties:
                        code:
                          type: string
                          maxLength: 2
                          example: B1
                    component:
                      type: object
                      description: Component (VMRS CK33).
                      properties:
                        code:
                          type: string
                          maxLength: 11
                          example: 023-000-000
                    position:
                      type: object
                      description: Position (VMRS CK79).
                      properties:
                        code:
                          type: string
                          maxLength: 2
                          example: '03'
                    operator_report:
                      type: array
                      description: Operator reports (VMRS CK82).
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            maxLength: 3
                            example: '001'
          required:
          - type
          - attributes
          - id
    error_response:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
        detail:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        source:
          type: object
          properties:
            parameter:
              type:
              - string
              - 'null'
            pointer:
              type:
              - string
              - 'null'
        links:
          type: object
          description: Links related to this error (e.g. documentation reference).
          additionalProperties:
            type: string
            format: uri
      required:
      - status
      - title
    relationship_object:
      type: object
      properties:
        data:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            type:
              type: string
          required:
          - id
          - type
      required:
      - data
    line_item:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: 'A line_item represents a single operation (complaint/cause/correction) on the case.

            '
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              enum:
              - line_items
            attributes:
              type: object
              properties:
                complaint:
                  type:
                  - string
                  - 'null'
                  description: Customer-reported issue that originated the operation.
                  maxLength: 6000
                cause:
                  type:
                  - string
                  - 'null'
                  description: Diagnosed cause of the issue.
                  maxLength: 6000
                correction:
                  type:
                  - string
                  - 'null'
                  description: Repair action performed (or to be performed) to address the cause.
                  maxLength: 6000
                internal_label:
                  type:
                  - string
                  - 'null'
                  description: Workflow status of the line item. Values are configurable per account — see `GET /line_item_internal_labels` for the accepted values. `none` is always accepted and represents "no label".
                  maxLength: 255
                  example: approved
                description:
                  type:
                  - string
                  - 'null'
                  description: Free-form notes on the operation, distinct from `complaint` / `cause` / `correction`.
                  maxLength: 6000
                price_code:
                  type:
                  - string
                  - 'null'
                  description: Dealer-defined identifier of a pricing tier used to look up custom labor and parts rates for the line item.
                  maxLength: 255
                approval_group_tag:
                  type:
                  - string
                  - 'null'
                  description: Free-form tag used to group line items together for approval workflows.
                  maxLength: 255
                  example: GROUP-A
                billing_classification:
                  type:
                  - string
                  - 'null'
                  description: How the operation is billed, derived from the operation type. `billable` is the default (no special operation type); the remaining values indicate the operation is not directly billed to the customer.
                  enum:
                  - billable
                  - warranty
                  - policy
                  - campaign
                  - recall
                  example: billable
                under_warranty:
                  type: boolean
                  description: Whether the operation is classified as warranty work (a convenience flag derived from `billing_classification` / the operation type).
                  example: false
                labor:
                  type: object
                  description: Labor inputs for the operation — estimated hours (`time`) and the technician tier (`skill_level`) whose rate drives the calculated labor price in `pricing.labor`.
                  properties:
                    time:
                      type:
                      - number
                      - 'null'
                      description: Labor hours required for the operation.
                      example: 2
                    skill_level:
                      type:
                      - string
                      - 'null'
                      description: Labor skill level applied to the operation. Values are configurable per account — see `GET /skill_levels` for the accepted values.
                      example: C
                paint:
                  type: object
                  description: Paint inputs for the operation — estimated hours (`time`), hourly `rate`, calculated `total`, and the technician tier (`skill_level`).
                  properties:
                    time:
                      type:
                      - number
                      - 'null'
                      description: Paint hours required for the operation.
                      example: 1.5
                    rate:
                      type:
                      - number
                      - 'null'
                      description: Hourly paint labor rate applied to the operation.
                      example: 95
                    total:
                      type:
                      - number
                      - 'null'
                      description: Calculated paint total (time × rate).
                      example: 142.5
                    skill_level:
                      type:
                      - string
                      - 'null'
                      description: Paint skill level applied to the operation.
                      example: P1
                name:
                  type:
                  - string
                  - 'null'
                  description: Human-readable name of the operation performed (e.g. `Air Dryer Cartridge, Replacement`), distinct from `opcode` which is the short identifier.
                  maxLength: 510
                  example: Air Dryer Cartridge, Replacement
                opcode:
                  type: string
                  description: Short identifier for the operation (e.g. `T3789-0-04`), drawn from the operation catalog or set on a custom operation. The serializer falls back through DMS-mapped opcode, source-system opcode, then the catalog opcode.
                  maxLength: 255
                  example: T3789-0-04
                work_status:
                  type:
                  - object
                  - 'null'
                  description: The current work-status transition for the line item (its most recent status history record). Null when the operation has no work status yet.
                  properties:
                    code:
                      type: string
                      description: The work-status transition code.
                      enum:
                      - start
                      - stop
                      - complete
                      - reopen
                      example: start
                    reason:
                      type:
                      - string
                      - 'null'
                      description: Standardized reason for the transition (primarily for `stop`). Null when the transition has no reason.
                      enum:
                      - break
                      - meal
                      - shift_change
                      - reassigned
                      - sick
                      - injured
                      - awaiting_approval
                      - awaiting_parts
                      - awaiting_tools
                      - awaiting_tech_support
                      - user_defined_1
                      - user_defined_2
                      - user_defined_3
                      - user_defined_4
                      - null
                      example: awaiting_parts
                    timestamp:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: When the transition occurred (ISO 8601).
                    set_by_user:
                      type:
                      - object
                      - 'null'
                      description: The user the work status is attributed to.
                      properties:
                        id:
                          type:
                          - string
                          - 'null'
                          description: The user's identifier.
                        name:
                          type:
                          - string
                          - 'null'
                          description: The user's full name.
                approval_status:
                  type:
                  - object
                  - 'null'
                  description: The metadata-backed approval status for the line item. Null when no approval has been recorded.
                  properties:
                    name:
                      type: string
                      description: The approval status.
                      enum:
                      - requested
                      - approved
                      - declined
                      - deferred
                      example: approved
                    reason:
                      type:
                      - string
                      - 'null'
                      description: Reason associated with the approval decision.
                    reason_description:
                      type:
                      - string
                      - 'null'
                      description: Free-form description of the approval reason.
                    reviewed_by:
                      type:
                      - object
                      - 'null'
                      description: The user who set the approval status.
                      properties:
                        id:
                          type:
                          - string
                          - 'null'
                          description: The reviewing user's identifier.
                        name:
                          type:
                          - string
                          - 'null'
                          description: The reviewing user's full name.
                    reviewed_at:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: When the approval status was last updated (ISO 8601).
                pricing:
                  type: object
                  description: Server-computed pricing breakdown — top-level totals plus per-category sub-totals for `labor`, `parts`, `core_price`, and `additional_charges`. The top-level object and `labor` expose `fixed_total` for flat-rate operations; the other sub-totals expose `estimated_total` only.
                  properties:
                    estimated_total:
                      type:
                      - string
                      - 'null'
                      format: decimal
                      description: Estimated total for the line item, dynamically calculated from labor time, parts, and additional charges. Null when the line item is fixed-price.
                      example: '330.00'
                    fixed_total:
                      type:
                      - string
                      - 'null'
                      format: decimal
                      description: Fixed total for the line item — a flat-rate price tied to a fixed-price opcode, not dynamically calculated. Null when the line item is estimated.
                      example: '425.00'
                    labor:
                      type: object
                      properties:
                        estimated_total:
                          type:
                          - string
                          - 'null'
                          format: decimal
                          description: Estimated labor price, calculated from labor time. Null when labor is fixed-price.
                          example: '140.00'
                        fixed_total:
                          type:
                          - string
                          - 'null'
                          format: decimal
                          description: Fixed labor price for fixed-price labor, not dynamically calculated. Null when labor is estimated.
                          example: '180.00'
                    parts:
                      type: object
                      properties:
                        estimated_total:
                          type: string
                          format: decimal
                          description: Estimated total for parts, calculated from the parts list.
                          example: '140.00'
                    additional_charges:
                      type: object
                      properties:
                        estimated_total:
                          type: string
                          format: decimal
                          description: Sum of additional charges on the line item.
                          example: '50.00'
                    core_price:
                      type: object
                      properties:
                        estimated_total:
                          type: string
                          format: decimal
                          description: Estimated total for core charges on the parts list.
                vmrs:
                  type: object
                  description: 'Vehicle Maintenance Reporting Standards (VMRS) coding for the line item, exposing six VMRS code categories: reason for repair (CK14), operator report (CK82), component code (CK33), position (CK79), technician failure (CK18), and work accomplished (CK15). Each section is null when no code of that category is assigned.'
                  properties:
                    reason_for_repair:
                      type:
                      - object
                      - 'null'
                      description: Identifies what caused an asset to come in for repair
                      properties:
                        code_key:
                          type: string
                          description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                          example: '14'
                        code:
                          type: string
                          description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                          example: '01'
                    operator_report:
                      type:
                      - array
                      - 'null'
                      description: Identifies what the operator reports as being the issue
                      items:
                        type: object
                        properties:
                          code_key:
                            type: string
                            description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                            example: '82'
                          code:
                            type: string
                            description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                            example: '001'
                    component:
                      type:
                      - object
                      - 'null'
                      description: Provides universal identifiers or generic terms for parts
                      properties:
                        code_key:
                          type: string
                          description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                          example: '33'
                        code:
                          type: string
                          description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                          example: 023-000-000
                    position:
                      type:
                      - object
                      - 'null'
                      description: Identifies position based on industry-accepted conventions
                      properties:
                        code_key:
                          type: string
                          description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                          example: '79'
                        code:
                          type: string
                          description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                          example: '03'
                    technician_failure:
                      type:
                      - object
                      - 'null'
                      description: Identifies the technical failure diagnosed by the technician
                      properties:
                        code_key:
                          type: string
                          description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                          example: '18'
                        code:
                          type: string
                          description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                          example: B1
                    work_accomplished:
                      type:
                      - object
                      - 'null'
                      description: Identifies the repair action the technician performed
                      properties:
                        code_key:
                          type: string
                          description: VMRS code key — the category bucket within the ATA Vehicle Maintenance Reporting Standards (e.g. `14` Reason for Repair, `33` Component, `15` Work Accomplished).
                          example: '15'
                        code:
                          type: string
                          description: The VMRS code value selected within the parent `code_key`; meaning is scoped to that category.
                          example: A
            relationships:
              type: object
              properties:
                parts:
                  description: Parts consumed or quoted on this line item, each contributing to `pricing.parts.estimated_total`. Returned as a JSON:API to-many relationship; expand via `include=parts`.
                  $ref: '#/components/schemas/relationship_objects'
                technician_stories:
                  description: Technician-authored notes attached to this line item, capturing the diagnostic narrative around the complaint/cause/correction. To-many; expand via `include=technician_stories`.
                  $ref: '#/components/schemas/relationship_objects'
                assignee:
                  description: The user assigned to perform the operation on this line item. To-one; expand via `include=assignee`.
                  $ref: '#/components/schemas/relationship_object'
                case:
                  description: The case (estimate) this line item belongs to. To-one; only present when expanded via `include=case` (used by the account-wide `GET /line_items` collection).
                  $ref: '#/components/schemas/relationship_object'
          required:
          - attributes
          - type
          - id
