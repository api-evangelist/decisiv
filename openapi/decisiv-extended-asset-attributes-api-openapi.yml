openapi: 3.2.0
info:
  title: Decisiv Extended Asset Attributes API
  version: 0.48.24
  contact:
    name: Decisiv Support
    email: support@decisiv.com
    url: https://www.decisiv.com
  license:
    name: Proprietary
    identifier: proprietary
    url: https://www.decisiv.com/terms-of-use/
  termsOfService: https://www.decisiv.com/terms-of-use
  description: 'Operations tagged Extended Asset Attributes across 2 of this provider''s published API definitions: decisiv-asset-management-openapi.yml, decisiv-service-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://srm-api.staging.decisivapps.com
- url: https://srm-api.decisivapps.com
security:
- OAuth2AuthorizationCode: []
  AccessToken: []
- OAuth2Password: []
  AccessToken: []
tags:
- name: Extended Asset Attributes
paths:
  /asset_management/{srm_account_id}/v1/extended_asset_attributes:
    get:
      operationId: listExtendedAssetAttributes
      description: Lists all extended asset attributes for the requested account.
      summary: List all Extended Asset Attributes for the requested account
      tags:
      - Extended Asset Attributes
      parameters:
      - name: srm_account_id
        in: path
        description: The account ID for SRM
        required: true
        schema:
          type: string
      - name: page[number]
        in: query
        required: false
        schema:
          type: number
        description: Page number
      - name: page[size]
        in: query
        required: false
        schema:
          type: number
        description: Page size
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - account_extended_attribute
            - registered_asset
        description: The relationships to be included.
      - name: filter[account_extended_attribute.id]
        in: query
        required: false
        schema:
          type: string
        description: Filters the extended asset attribute for the given account_extended_attribute.id, using exact matching search
      - name: filter[registered_asset.id]
        in: query
        required: false
        schema:
          type: string
        description: Filters the extended asset attribute for the given registered_asset.id, using exact matching search
      responses:
        '200':
          description: Returns list of extended asset attributes
          content:
            application/vnd.api+json:
              example:
                data:
                - id: 3e5f4d4d-8a3d-43d7-8b55-73a0b38adbf9
                  type: extended_asset_attributes
                  attributes:
                    value: values
                  relationships:
                    account_extended_attribute:
                      data:
                        type: extended_attributes
                        id: 3e5f4d4d-8a3d-43d7-8b55-73a0b38adbf9
                    registered_asset:
                      data:
                        type: registered_assets
                        id: ed1641a8-fa41-478a-bd2e-dd72013096b0
              schema:
                $ref: '#/components/schemas/extended_asset_attributes'
        '400':
          description: Account filter is missing
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Required filter is missing
                  detail: 'Required filter must be provided. Valid required filters: srm_account_id'
                  code: decisiv:filters:006
                  status: '400'
                  source:
                    parameter: filter[srm_account_id]
              schema:
                $ref: '#/components/schemas/errors_response'
        '401':
          description: This response may occur when the access token provided within the Authorization token has expired.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Access unauthorized
                  detail: Access unauthorized
                  code: decisiv::access_token:001
                  status: '401'
              schema:
                $ref: '#/components/schemas/errors_response'
        '403':
          description: This response may occur when the authenticated user embedded within the Authorization header does not have access to the requested resource.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Forbidden
                  detail: User does not have permission to perform this action on the requested resource(s)
                  code: decisiv:access:001
                  status: '403'
              schema:
                $ref: '#/components/schemas/errors_response'
        '428':
          description: This response represents requests to a module or endpoint which can not immediately be accessed due to the Account permissions and subscriptions in the Decisiv Platform.
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '428'
                  code: decisiv:access:003
                  title: Precondition required
                  detail: OAuth Application does not have appropriate provisioning to access this resource
