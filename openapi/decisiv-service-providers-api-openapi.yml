            application/vnd.api+json:
              example:
                errors:
                - code: '504'
                  detail: Gateway timeout error
                  status: '504'
                  title: Gateway timeout error
              schema:
                $ref: '#/components/schemas/errors_response'
    servers:
    - url: https://srm-api.staging.decisivapps.com
    - url: https://srm-api.decisivapps.com
components:
  schemas:
    error_response:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
        detail:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        source:
          type: object
          properties:
            parameter:
              type:
              - string
              - 'null'
            pointer:
              type:
              - string
              - 'null'
        links:
          type: object
          description: Links related to this error (e.g. documentation reference).
          additionalProperties:
            type: string
            format: uri
      required:
      - status
      - title
    service_provider:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the Service Provider
                  minLength: 1
                  maxLength: 150
                address1:
                  type: string
                  description: Primary Address for the Service Provider
                  minLength: 0
                  maxLength: 255
                address2:
                  type: string
                  description: Secondary address identifier
                  minLength: 0
                  maxLength: 255
                city:
                  type: string
                  description: City which the Service Provider business resides
                  minLength: 0
                  maxLength: 30
                state:
                  type: string
                  description: 2 Letter state abbreviation
                  minLength: 0
                  maxLength: 2
                postal_code:
                  type: string
                  description: Postal zip code of the Service Provider location
                  minLength: 0
                  maxLength: 18
                country:
                  type: string
                  description: Country of Service Povider, in `ISO 3166-1 alpha-2` format
                  minLength: 0
                  maxLength: 2
                phone:
                  type: string
                  description: Telephone contact information for the Service Provider
                  minLength: 0
                  maxLength: 30
                fax:
                  type: string
                  description: Fax information for the Service Provider
                  minLength: 0
                  maxLength: 30
                email:
                  type: string
                  description: Email contact information for the Service Provider
                  minLength: 0
                  maxLength: 120
                location:
                  type: object
                  description: Geolocation information about the Service Provider
                  properties:
                    latitude:
                      type: number
                    longitude:
                      type: number
                    distance_from_geolocation:
                      type: number
                external_reference:
                  type: object
                  description: External reference information for the Service Provider
                  properties:
                    srm_account_id:
                      type: string
                      description: SRM Account ID for the Service Provider
                      minLength: 7
                      maxLength: 7
            relationships:
              type: object
              properties:
                service_networks:
                  $ref: '#/components/schemas/relationship_object'
          required:
          - attributes
    service_providers:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/service_provider_properties-data'
        meta:
          type: object
    service_provider_properties-data:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        attributes:
          type: object
          properties:
            name:
              type: string
              description: Name of the Service Provider
              minLength: 1
              maxLength: 150
            address1:
              type: string
              description: Primary Address for the Service Provider
              minLength: 0
              maxLength: 255
            address2:
              type: string
              description: Secondary address identifier
              minLength: 0
              maxLength: 255
            city:
              type: string
              description: City which the Service Provider business resides
              minLength: 0
              maxLength: 30
            state:
              type: string
              description: 2 Letter state abbreviation
              minLength: 0
              maxLength: 2
            postal_code:
              type: string
              description: Postal zip code of the Service Provider location
              minLength: 0
