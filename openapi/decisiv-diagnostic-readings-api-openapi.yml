components:
  schemas:
    attributes:
      type: object
      properties:
        triggered_at:
          type: string
          format: date-time
          description: Date / Time when the diagnostic was triggered in `ISO8601` format
        sensor_readings:
          type: array
          description: Sensor readings captured at the time of the diagnostic
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the sensor
              description:
                type: string
                description: Description of the sensor
              value:
                type: string
                description: Sensor reading value
              unit_of_measure:
                type:
                - string
                - 'null'
                description: Unit of measure for the sensor reading
              classification_header:
                type: string
                description: Header group used to classify the reading in the UI
              key_data:
                type: boolean
                description: Flag indicating whether the reading should be highlighted in the UI
              localize:
                type: boolean
                description: Flag indicating whether the reading should be localized in the UI
        components:
          type: array
          description: Components reported by the diagnostic
          items:
            type: object
            properties:
