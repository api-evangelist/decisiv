                  data:
                    type: line_item_parts
                    id: 167f089e-339d-4d05-b175-9b10206c3cbf
                    attributes:
                      name: Valve
                      quantity: '4'
                      quantity_shipped: '2'
                      quantity_backordered: '0'
                      number: '1'
                      unit_price: '12.50'
                      core:
                        price: '12.50'
                        quantity: '1.0'
                    relationships:
                      salesperson:
                        data:
                          type: internal_users
                          id: 6383dc89-05b6-4572-8979-a6257f3597ec
    delete:
      summary: Delete an estimate item part
      tags:
      - Case Line Item Parts
      parameters:
      - name: srm_account_id
        in: path
        description: The account ID for SRM
        required: true
        schema:
          type: string
      - name: case_id
        in: path
        schema:
          type: string
          format: uuid
        description: The case UUID
        required: true
      - name: line_item_id
        in: path
        schema:
          type: string
          format: uuid
        description: The line item UUID
        required: true
      - name: id
        in: path
        schema:
          type: string
          format: uuid
        description: The resource UUID
        required: true
      responses:
        '204':
          description: Deletes an estimate item part
          content: {}
        '401':
          description: This response may occur when the access token provided within the Authorization token has expired.
