  /asset_management/{srm_account_id}/v1/depots/{id}/deactivate:
    post:
      operationId: deactivateDepot
      summary: Deactivates a Depot, removing it from the Account
      tags:
      - Depots
      parameters:
      - name: srm_account_id
        in: path
        description: The account ID for SRM
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: The resource uuid
        required: true
        schema:
          type: string
      description: 'Endpoint provides the ability to deactivate and remove a `Depot` from the specified `Asset Management` account.


        Once a `depot` is *deactivated* it will be accessible for historical purposes by calling:

        * `GET /deactivated_depots`

        * `GET /deactivated_depots/:id`


        Depots which have been made inactive in error can be reactivated if needed.'
      responses:
        '204':
          description: Successful deactivation of a Depot
          content: {}
        '400':
          description: This response may occur when an invalid request has been provided to the server.  The request may be corrected by the consumer and resubmitted.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Filter not allowed
                  detail: invalid is not allowed.
                  code: '002'
                  status: '400'
                - title: Bad Request
                  detail: Invalid value for X-DECISIV-SILENCE-EVENTS header
                  code: decisiv:silence_webhook_events:001
                  status: '400'
              schema:
                $ref: '#/components/schemas/errors_response'
        '401':
          description: This response may occur when the access token provided within the Authorization token has expired.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Access unauthorized
                  detail: Access unauthorized
                  code: decisiv::access_token:001
                  status: '401'
              schema:
                $ref: '#/components/schemas/errors_response'
        '403':
          description: This response may occur when the authenticated user embedded within the Authorization header does not have access to the requested resource.
          content:
            application/vnd.api+json:
              example:
                errors:
                - title: Forbidden
                  detail: User does not have permission to perform this action on the requested resource(s)
                  code: decisiv:access:001
                  status: '403'
              schema:
                $ref: '#/components/schemas/errors_response'
        '404':
          description: This response may occur when the requested resource is not found.
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '404'
                  code: decisiv:resource:001
                  title: Resource Identifier - Not Found
                  detail: The parent resource could not be found
                  source:
                    parameter: id
              schema:
                $ref: '#/components/schemas/errors_response'
        '409':
          description: This response may occur when the request conflict with the current state of the target resource.
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '409'
                  code: decisiv:depots:001
                  title: Resource Identifier - Deactivated Depot
                  detail: Operations are deactivated, the depot is inaccessible through this interface.
                  source:
                    parameter: id
              schema:
                $ref: '#/components/schemas/errors_response'
        '422':
          description: This response may occur when there is an error during the request processing.
          content:
            application/vnd.api+json:
              example:
                errors:
                - code: decisiv:depots:002
                  detail: Depot cannot be deactivated, it contains related assets.
                  status: '422'
                  title: Validation Error
              schema:
                $ref: '#/components/schemas/errors_response'
        '504':
          description: This response may occur when there is an unexpected system timeout.
          content:
            application/vnd.api+json:
              example:
                errors:
                - code: '504'
                  detail: Gateway timeout error
                  status: '504'
                  title: Gateway timeout error
              schema:
                $ref: '#/components/schemas/errors_response'
