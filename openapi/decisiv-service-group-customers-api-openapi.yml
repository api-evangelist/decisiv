      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              enum:
              - customers
              - registered_customers
              - service_group_customers
              - service_group_registered_customers
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the customer
                  maxLength: 100
                address1:
                  type: string
                  description: Primary address information
                  maxLength: 100
                address2:
                  type: string
                  description: Secondary address information
                  maxLength: 100
                city:
                  type: string
                  description: City in which the business resides
                  maxLength: 100
                state:
                  type: string
                  description: Second part of the `ISO 3166-2` code indicating the state
                  minLength: 1
                  maxLength: 3
                  example: NJ
                country:
                  type: string
                  description: '`ISO 3166-1` alpha-2 code indicating the country'
                  minLength: 2
                  maxLength: 2
                  example: US
                postal_code:
                  type: string
                  description: Postal ZIP Code
                  maxLength: 20
                phone:
                  type: string
                  description: Telephone number, must conform to E.164 standard
                  maxLength: 60
                fax:
                  type: string
                  description: Fax number, must conform to E.164 standard
                  maxLength: 60
                email:
                  type: string
                  description: Email contact information
                  maxLength: 128
                notes:
                  type: string
                  description: Free-form notes about the customer
                  example: Premium customer - call ahead
                account_number:
                  type: string
                  description: Account number for the customer (applies to MVP/OEM accounts)
                  maxLength: 36
                  example: ACC-1234
                external_reference:
                  type: object
                  description: Reference Identifiers used outside of Decisiv SRM
                  properties:
                    customer_number:
                      type: string
                      description: Number used to identify Customer record in external system
                      minLength: 1
                      maxLength: 40
                      deprecated: true
                    business_system:
                      type: string
                      description: Number used to identify Customer record in external system
                      minLength: 1
                      maxLength: 40
            relationships:
              type: object
              properties:
                srm_account:
                  $ref: '#/components/schemas/relationship_object'
                service_location:
                  $ref: '#/components/schemas/relationship_object'
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2AuthorizationCode:
      type: oauth2
      description: OAuth 2.0 Authorization Code flow. This is the required flow for new integrations. See https://api-docs.decisiv.net/docs/api/oauth/
      flows:
        authorizationCode:
          authorizationUrl: https://login.decisiv.net/auth/api_gateway
          tokenUrl: https://login.decisiv.net/oauth/token
          refreshUrl: https://login.decisiv.net/oauth/token
          scopes: {}
    OAuth2Password:
      type: oauth2
      description: '**Deprecated.** OAuth 2.0 Password flow. New integrations must use the Authorization Code flow (`OAuth2AuthorizationCode`); this flow remains available only during the migration window and will be removed in a future release. See https://api-docs.decisiv.net/docs/api/oauth/'
      flows:
        password:
          tokenUrl: https://login.decisiv.net/oauth/token
          scopes: {}
