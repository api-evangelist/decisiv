overlay: 1.0.0
info:
  title: API Evangelist enhancements for Decisiv Global Assets
  version: 1.0.0
extends: openapi/decisiv-global-assets-openapi.yml
actions:
- target: $.info
  description: Annotate with API Evangelist profile provenance and the artifacts derived from this spec.
  update:
    x-apievangelist-provider: decisiv
    x-apievangelist-profile: https://apis.io/provider/decisiv/
    x-apievangelist-harvested: '2026-08-12'
    x-apievangelist-source: https://global-assets.decisivapps.com/swagger-docs/v1/swagger.json
    x-apievangelist-artifacts:
      authentication: authentication/decisiv-authentication.yml
      scopes: scopes/decisiv-scopes.yml
      conventions: conventions/decisiv-conventions.yml
      errors: errors/decisiv-error-codes.yml
      problem-types: errors/decisiv-problem-types.yml
      lifecycle: lifecycle/decisiv-lifecycle.yml
      rate-limits: rate-limits/decisiv-rate-limits.yml
      data-model: data-model/decisiv-data-model.yml
      conformance: conformance/decisiv-conformance.yml
- target: $.info
  description: Record the runtime semantics an agent needs that are true of this API but not expressible in the
    spec itself.
  update:
    x-error-envelope: json-api-errors
    x-error-code-registry: errors/decisiv-error-codes.yml
    x-rate-limit-headers: []
    x-rate-limit-documented: false
