name: Decisiv Key Design System
description: >-
  A React component library and design-token set Decisiv publishes so customers and ecosystem partners
  can build SRM Ecosystem application front-ends that look and behave like Decisiv's own applications.
  Decisiv positions it as removing coding time via pre-built UI building blocks — cited examples are an
  ETA countdown clock and a real-time list of available technicians — and it covers both web and mobile.
  This is a UI toolkit, not an API client library: it does not call the SRM Gateway for you.
